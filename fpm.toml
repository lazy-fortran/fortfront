name = "fortfront"
version = "0.2.0"
description = "Core analysis frontend for lazy fortran - lexer, parser, semantic analysis, AST operations"
author = "krystophny"
license = "MIT"

[build]
auto-examples = false

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"

[[extra.fo.inputs]]
path = "examples"
kind = "directory"
role = "test-fixture"

[[extra.fo.inputs]]
path = "scripts"
kind = "directory"
role = "test-fixture"
