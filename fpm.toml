name = "fortfront"
version = "0.1.0"
description = "Core analysis frontend for lazy fortran - lexer, parser, semantic analysis, AST operations"
author = "krystophny"
license = "MIT"

[dependencies]
stdlib = "*"

[build]
# Lock executables to explicit list to prevent accidental test binaries in app/
auto-executables = false
auto-tests = true
auto-examples = true

[[executable]]
name = "fortfront"
source-dir = "app"
main = "fortfront.f90"

[[executable]]
name = "frontend_probe"
source-dir = "app"
main = "frontend_probe.f90"

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"
